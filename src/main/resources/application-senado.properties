# Configurações específicas para a API do Senado Federal

# URL base da API do Senado
senado.api.base-url=https://legis.senado.leg.br
senado.api.timeout=30000
senado.api.max-retries=3

# Configurações de logging específicas para o Senado
logging.level.com.poo.demo.application.service.SenadoApiService=DEBUG
logging.level.com.poo.demo.application.service.ApiExplorerService=DEBUG

# Configurações de cache para dados do Senado
senado.cache.enabled=true
senado.cache.ttl=3600

# Configurações de rate limiting
senado.rate-limit.enabled=true
senado.rate-limit.requests-per-minute=60

# Configurações de endpoints específicos
senado.endpoints.materias=/dadosabertos/materias
senado.endpoints.senadores=/dadosabertos/senadores
senado.endpoints.sessoes=/dadosabertos/sessoes
senado.endpoints.legislaturas=/dadosabertos/legislaturas
senado.endpoints.comissoes=/dadosabertos/comissoes
senado.endpoints.autores=/dadosabertos/autores
senado.endpoints.tramitacoes=/dadosabertos/tramitacoes
senado.endpoints.votacoes=/dadosabertos/votacoes
senado.endpoints.emendas=/dadosabertos/emendas
senado.endpoints.pautas=/dadosabertos/pautas
senado.endpoints.ordens=/dadosabertos/ordens
senado.endpoints.atas=/dadosabertos/atas
senado.endpoints.documentos=/dadosabertos/documentos
senado.endpoints.noticias=/dadosabertos/noticias
