spring.application.name=AnaliseSenadores

# Configurações do servidor
server.port=8080
server.servlet.context-path=/

# Configurações de logging
logging.level.com.poo.demo=DEBUG
logging.level.org.springframework.web=INFO

# Configurações de timeout para requisições HTTP
spring.mvc.async.request-timeout=30000

# Configurações de CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Spring Boot DevTools para hot reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**

# ===== CONFIGURAÇÕES DO BANCO DE DADOS =====

# Configurações do MySQL (desenvolvimento local)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:analise_senadores}?useSSL=false&serverTimezone=UTC&characterEncoding=${MYSQL_CHARSET:utf8}&useUnicode=true&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
# Driver será definido pelo profile específico

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.CharSet=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true

# Configurações do Flyway para migrações
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ===== CONFIGURAÇÕES DO SPRING BOOT ACTUATOR =====

# Habilitar endpoints do Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# Configurações de health check
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=100MB

# Configurações de métricas
management.metrics.export.simple.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true