spring.application.name=AnaliseSenadores

# Configurações do servidor
server.port=8080
server.servlet.context-path=/

# Configurações de logging
logging.level.com.poo.demo=DEBUG
logging.level.org.springframework.web=INFO

# Configurações de timeout para requisições HTTP
spring.mvc.async.request-timeout=30000

# Configurações de CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Spring Boot DevTools para hot reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**

# ===== CONFIGURAÇÕES DO SPRING BOOT ACTUATOR =====

# Habilitar endpoints do Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# Configurações de health check
management.health.diskspace.enabled=true
management.health.diskspace.threshold=100MB

# Configurações de métricas
management.simple.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Configurações do SpringDoc OpenAPI
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true