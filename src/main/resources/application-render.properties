# Configurações específicas para ambiente Render (PostgreSQL)

# Forçar uso do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do servidor
server.port=${PORT}

# Configurações de logging
logging.level.com.poo.demo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN

# Configurações de CORS para produção
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Configurações de timeout para requisições HTTP
spring.mvc.async.request-timeout=30000

# Configurações do banco de dados PostgreSQL
# A configuração do DataSource é feita pela classe DatabaseConfig
# que converte automaticamente DATABASE_URL de postgresql:// para jdbc:postgresql://
# Variáveis de fallback para desenvolvimento local
DB_HOST=${DB_HOST}
DB_PORT=${DB_PORT}
DB_NAME=${DB_NAME}
DB_USER=${DB_USER}
DB_PASSWORD=${DB_PASSWORD}

# Configurações do JPA/Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# PostgreSQL não precisa de configurações de charset específicas

# Configurações do Flyway para PostgreSQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.schemas=public
spring.flyway.default-schema=public

# Configurações do Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=100MB
management.metrics.export.simple.enabled=true

# Configurações de segurança
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
