# Configurações específicas para ambiente de produção

# Configurações do servidor
server.port=${PORT:8080}

# Configurações de logging
logging.level.com.poo.demo=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN

# Configurações de CORS para produção
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Configurações de timeout para requisições HTTP
spring.mvc.async.request-timeout=30000

# Configurações do banco de dados
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC&characterEncoding=${MYSQL_CHARSET}&useUnicode=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# Configurações do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Configurações do Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=100MB
management.metrics.export.simple.enabled=true

# Configurações de segurança
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
