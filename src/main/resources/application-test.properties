# Configurações para ambiente de teste
# Usa H2 em memória para testes rápidos

# Configuração do banco de dados (H2 em memória)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuração do Flyway (desabilitado para testes)
spring.flyway.enabled=false

# Configuração do JWT (valores de teste)
jwt.secret=test-secret-key-for-testing-only
jwt.expiration=3600000

# Configuração do CORS para testes
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Configuração do Actuator (desabilitado para testes)
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Configuração de logging para testes
logging.level.com.poo.demo=DEBUG
logging.level.org.springframework.security=DEBUG
