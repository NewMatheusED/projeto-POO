# Configurações específicas para testes
# Este arquivo tem prioridade sobre o application-test.properties principal

# Configuração do banco de dados (H2 em memória)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop

# Configuração do Flyway (desabilitado para testes)
spring.flyway.enabled=false

# Configuração do JWT (valores de teste)
jwt.secret=test-secret-key-for-testing-only-very-long-key-for-hmac-sha256
jwt.expiration=3600000

# Configuração do CORS para testes
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Configuração do Actuator (mínimo para testes)
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.health.show-details=when-authorized

# Configuração de logging para testes
logging.level.com.poo.demo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Configuração de scheduler (desabilitado para testes)
spring.task.scheduling.enabled=false

# Desabilitar limpeza automática de tokens nos testes
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true