# Configurações específicas para testes

# Configurações do servidor
server.port=0

# Configurações de logging
logging.level.com.poo.demo=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN

# Configurações do banco de dados para testes
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:test_db}?useSSL=false&serverTimezone=UTC&characterEncoding=${MYSQL_CHARSET:UTF-8}&useUnicode=true&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:test_user}
spring.datasource.password=${MYSQL_PASSWORD:test_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA/Hibernate para testes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# Configurações do Flyway para testes
spring.flyway.enabled=false

# Configurações do Actuator para testes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
