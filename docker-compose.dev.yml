services:
  # Aplicação Spring Boot para desenvolvimento
  api:
    image: docker.io/${DOCKER_USERNAME}/senate_tracker_api:dev
    container_name: api-dev
    restart: unless-stopped
    command: ["java", "-jar", "app.jar", "--spring.profiles.active=dev"]
    environment:
      # Configurações da aplicação
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      
      # Configurações de desenvolvimento
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: true
      
      # Timezone
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src:ro
      - ./target:/app/target
      - ./pom.xml:/app/pom.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/v1/health > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
