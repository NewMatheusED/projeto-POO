services:
  # Aplicação Spring Boot para produção
  api:
    image: newmatheused/senate_tracker_api:latest
    container_name: api
    restart: unless-stopped
    environment:
      # Configurações da aplicação
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8080
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
      
      # Timezone
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/actuator/health > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
